name: DatRey Blog Autopilot & Social Publishing

on:
  schedule:
    # Runs at 09:00, 12:00, and 20:00 Morocco Time (08:00, 11:00, 19:00 UTC)
    - cron: '0 8,11,19 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_autopilot]

permissions:
  contents: write

jobs:
  generate_content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Autopilot Engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python -m autopilot.cli --auto

      - name: Commit and Push Changes
        run: |
          git config --global user.name "DatRey Autopilot Bot"
          git config --global user.email "bot@datrey.ma"
          git add blog/ assets/blog/ blog_data.json blog.html sitemap*.xml autopilot_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto(blog): publish daily articles and update sitemaps" && git push)
